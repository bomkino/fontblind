name: Final Gate 7 gauntlet correction

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply final Gate 7 gauntlet correction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply correction
        run: |
          python tools/g7_patch.py
          rm -f tools/g7_patch.py
          rm -f .github/workflows/g7-patch.yml
      - name: Validate
        run: |
          python -m py_compile release_gauntlet.py
          ! grep -q 'public_variable = bool' release_gauntlet.py
          grep -q 'downloaded native artifact is the authoritative model proof' release_gauntlet.py
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Keep internal font-model flags out of the release response contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
