name: Gate 7 frozen-corpus model fix

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply the frozen-corpus public-model fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply public-model fix
        run: |
          python tools/fix_gate7_release_model.py
          rm -f tools/fix_gate7_release_model.py
          rm -f .github/workflows/gate7-release-model.yml
      - name: Validate
        run: |
          python -m py_compile release_gauntlet.py
          python - <<'PY'
          import release_gauntlet
          assert release_gauntlet.main(["release_gauntlet.py"]) == 64
          PY
          grep -q 'public_variable = bool(corpus_result.get("axes"))' release_gauntlet.py
          grep -q 'changed native font model' release_gauntlet.py
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Use the reviewed public axis contract in the frozen corpus gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
