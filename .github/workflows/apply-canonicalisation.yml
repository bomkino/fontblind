name: Apply canonicalisation payload

on:
  push:
    branches: [codex/linux-browser-app-foundation]
    paths: [.github/workflows/apply-canonicalisation.yml]

permissions:
  contents: write

concurrency:
  group: apply-fontblind-canonicalisation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify and apply exact payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .canonicalise -maxdepth 1 -type f -name 'payload-*.b64' | wc -l)" -eq 4
          cat .canonicalise/payload-*.b64 | base64 --decode > "$RUNNER_TEMP/payload.tar.xz"
          echo "d966ba13a889058211503e62d17eacf41c1efe238723029471ce627497879509  $RUNNER_TEMP/payload.tar.xz" | sha256sum -c -
          PAYLOAD="$RUNNER_TEMP/payload.tar.xz" python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(os.environ["PAYLOAD"], "r:xz") as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"links are not permitted: {member.name}")
          PY
          tar -xJf "$RUNNER_TEMP/payload.tar.xz" -C .
          while IFS= read -r path; do
            test -z "$path" || rm -f -- "$path"
          done < .canonicalise/delete.txt
          rm -rf .canonicalise
          rm -f .github/workflows/apply-canonicalisation.yml

      - name: Commit canonical repository state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q .
          for file in web/*.js; do node --check "$file"; done
          git add -A
          git diff --cached --check
          git config user.name pitch.dog
          git config user.email 111725271+bomkino@users.noreply.github.com
          git commit -m "feat: canonicalise FontBlind 3.7 across macOS and experimental Garuda"
          git push origin HEAD:codex/linux-browser-app-foundation
