name: Gate 7 release-download back-pressure

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply bounded release-download back-pressure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply bounded back-pressure handling
        run: |
          python tools/fix_gate7_download_backpressure.py
          rm -f tools/fix_gate7_download_backpressure.py
          rm -f .github/workflows/gate7-download-backpressure.yml
      - name: Validate
        run: |
          python -m py_compile release_gauntlet.py
          grep -q 'for _attempt in range(50)' release_gauntlet.py
          grep -q 'download failed: {status}' release_gauntlet.py
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Respect bounded download back-pressure in the release gauntlet"
          git push origin "HEAD:${GITHUB_REF_NAME}"
