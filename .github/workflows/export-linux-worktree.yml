name: Export Linux working tree

on:
  push:
    branches:
      - codex/linux-browser-app-foundation

permissions:
  contents: read

jobs:
  export:
    if: github.event.head_commit.message == 'Export Linux working tree'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fontblind-linux-working-tree
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
