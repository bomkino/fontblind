name: Gate 7 frozen corpus integration

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Gate 7 frozen corpus integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply frozen-runtime corpus gate
        run: |
          python tools/apply_gate7_corpus_release.py
          rm -f tools/apply_gate7_corpus_release.py
          rm -f .github/workflows/gate7-corpus-release.yml
      - name: Validate syntax and focused corpus opt-in
        run: |
          python -m py_compile release_gauntlet.py tests/test_corpus.py
          python - <<'PY'
          import release_gauntlet
          assert release_gauntlet.main(["release_gauntlet.py"]) == 64
          PY
          grep -q 'FONTBLIND_RUN_FULL_CORPUS' tests/test_corpus.py
          grep -q 'FONTBLIND_CORPUS_DIR' build-fontblind-app.command
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Run the representative corpus through the frozen runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
