name: Apply Garuda KDE target

on:
  push:
    branches:
      - codex/linux-browser-app-foundation

permissions:
  contents: write

concurrency:
  group: apply-garuda-kde-target
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Garuda KDE target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/linux-browser-app-foundation
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Reconstruct reviewed patch
        run: |
          test "$(git hash-object .garuda-target-patch/part-01)" = "6607c3e56ea83b993ab86031e3441391cf987e38"
          test "$(git hash-object .garuda-target-patch/part-02)" = "7a6c4a0774c885c12c813d5b5d97fcd862ea9197"
          test "$(git hash-object .garuda-target-patch/part-03)" = "988023746c71905fd309fd91922bd6c0f0db3d6c"
          test "$(git hash-object .garuda-target-patch/part-04a)" = "d60bfbd016c160b91fae842a7eba496aca68d6bc"
          test "$(git hash-object .garuda-target-patch/part-04b)" = "16448ede7c83c1ad916d0a46a23dc7d07d671f5c"
          test "$(git hash-object .garuda-target-patch/part-05)" = "92191fd3bfcc03292e9ace1f133df8b5ef2eeb97"
          test "$(git hash-object .garuda-target-patch/part-06)" = "28953ee1be7aea0b7bbb07314b753218054ffea7"
          test "$(git hash-object .garuda-target-patch/part-07)" = "a831ff9d5c2000ff0df07745f3400709e565c715"
          cat \
            .garuda-target-patch/part-01 \
            .garuda-target-patch/part-02 \
            .garuda-target-patch/part-03 \
            .garuda-target-patch/part-04a \
            .garuda-target-patch/part-04b \
            .garuda-target-patch/part-05 \
            .garuda-target-patch/part-06 \
            .garuda-target-patch/part-07 \
            | base64 -d | gzip -d > /tmp/garuda-target.patch
          git apply --check /tmp/garuda-target.patch
          git apply --whitespace=error-all /tmp/garuda-target.patch
          rm -rf .garuda-target-patch
          # GitHub's workflow token cannot modify workflow files. Keep those
          # paths unchanged in this push; the connected repository writer
          # applies the separately reviewed workflow update and cleanup.
          git restore --source=HEAD -- .github/workflows
      - name: Validate focused target contracts
        run: |
          bash -n build-fontblind-linux.sh
          bash -n linux/verify-installed-package.sh
          sh -n linux/fontblind
          python -m py_compile fontblind_desktop.py tests/test_desktop_lifecycle.py tests/test_linux_package.py
          python -m unittest \
            tests.test_linux_package.GarudaPackageContractTests.test_builder_has_one_x86_64_pacman_artifact_and_one_runtime \
            tests.test_linux_package.GarudaPackageContractTests.test_desktop_entry_is_kde_visible_without_terminal_or_file_arguments \
            tests.test_linux_package.GarudaPackageContractTests.test_installed_gate_models_plasma_wayland_and_full_product_proof \
            tests.test_linux_package.GarudaPackageContractTests.test_kde_launcher_is_root_refusing_and_uses_the_browser_host \
            tests.test_linux_package.GarudaPackageContractTests.test_pkgbuild_is_fixed_to_the_garuda_arch_contract \
            tests.test_linux_package.GarudaPackageContractTests.test_public_claims_are_exactly_bounded \
            tests.test_desktop_lifecycle -v
          node --check web/desktop-runtime.js
          node --test tests/desktop-runtime.test.cjs
      - name: Commit narrowed Garuda KDE implementation
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Narrow Linux support to Garuda KDE on the Dell G7"
          git push origin "HEAD:${GITHUB_REF_NAME}"
