name: Gate 7 binary canonicalization

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Gate 7 binary canonicalization'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply canonical container validators
        run: |
          python tools/apply_gate7_binary_canonicalization.py
          rm -f tools/apply_gate7_binary_canonicalization.py
          rm -f .github/workflows/gate7-canonicalize.yml
      - name: Validate focused boundary
        run: |
          python -m pip install .
          python -m py_compile fontblind_artifacts.py tests/test_binary_canonicalization.py
          python -m unittest tests.test_binary_canonicalization -v
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize generated font and ZIP containers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
