name: Gate 7 corpus findings

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Gate 7 corpus findings'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply corpus findings
        run: |
          python tools/apply_gate7_corpus_findings.py
          rm -f tools/apply_gate7_corpus_findings.py
          rm -f .github/workflows/gate7-corpus-findings.yml
      - name: Validate focused fixes
        env:
          FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
          FONTBLIND_RUN_FULL_CORPUS: "1"
        run: |
          python -m pip install .
          python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
          python -m unittest tests.test_corpus.RepresentativeCorpusTests.test_extracted_existing_variable_donors_fail_closed_on_geometry_drift -v
          python -m unittest tests.test_pipeline.PipelineTests.test_variable_axes_survive_native_and_web_roundtrip -v
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Record real donor drift as a refusal and preserve instance labels"
          git push origin "HEAD:${GITHUB_REF_NAME}"
