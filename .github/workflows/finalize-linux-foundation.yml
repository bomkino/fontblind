name: Finalize Linux browser-app foundation

on:
  push:
    branches:
      - codex/linux-browser-app-foundation

permissions:
  contents: write

concurrency:
  group: finalize-linux-browser-app-foundation
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize Linux browser-app foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/linux-browser-app-foundation
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Finalize reviewed integration
        run: python tools/finalize_linux_foundation.py
      - name: Validate focused Linux boundary
        run: |
          sh -n linux/fontblind-launcher.sh
          bash -n build-fontblind-linux.sh
          python -m py_compile tests/test_linux_packaging.py
          python -m unittest tests.test_linux_packaging -v
          test ! -e .github/workflows/export-linux-worktree.yml
          test ! -e .github/workflows/apply-linux-foundation.yml
          test ! -e .github/workflows/finalize-linux-foundation.yml
          test ! -e tools/apply_linux_foundation.py
          test ! -e tools/finalize_linux_foundation.py
      - name: Commit final Linux foundation
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Add the verified Linux browser-app package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
