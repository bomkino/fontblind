name: Apply Lab hardening

on:
  push:
    branches: [improve/lab-hardening-3.5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: improve/lab-hardening-3.5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Repair guarded patch scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          part1_path = Path("tools/apply_v350_part1.py")
          part1 = part1_path.read_text(encoding="utf-8")
          old_validation = '        if not isinstance(raw_axes, (list, tuple)) or not isinstance(raw_masters, (list, tuple)):\n            raise ValueError("FontBlind worker returned malformed Lab inspection data")\n        result = cls(\n'
          new_validation = '        if not isinstance(raw_axes, (list, tuple)) or not isinstance(raw_masters, (list, tuple)):\n            raise ValueError("FontBlind worker returned malformed Lab inspection data")\n        if type(value.get("variable")) is not bool or type(value.get("color")) is not bool:\n            raise ValueError("FontBlind worker returned malformed font descriptors")\n        result = cls(\n'
          if part1.count(old_validation) != 1:
              raise RuntimeError("part1 descriptor validation drifted")
          part1 = part1.replace(old_validation, new_validation, 1)
          old_flags = '            bundle=OutputFile(**dict(value["bundle"])),\n            flavor=str(value["flavor"]),\n            variable=bool(value["variable"]),\n            color=bool(value["color"]),\n'
          new_flags = '            bundle=OutputFile(**dict(value["bundle"])),\n            flavor=str(value["flavor"]),\n            variable=value["variable"],\n            color=value["color"],\n'
          if part1.count(old_flags) != 1:
              raise RuntimeError("part1 descriptor assignment drifted")
          part1_path.write_text(part1.replace(old_flags, new_flags, 1), encoding="utf-8")

          part3_path = Path("tools/apply_v350_part3.py")
          part3 = part3_path.read_text(encoding="utf-8")
          old_guard = '    if count != 1:\n        raise RuntimeError(f"{label}: expected one match, found {count}")\n'
          new_guard = '    if count != 1 and not (label == "test app first variable media type" and count == 2):\n        raise RuntimeError(f"{label}: expected one match, found {count}")\n'
          if part3.count(old_guard) != 1:
              raise RuntimeError("part3 replace guard drifted")
          part3 = part3.replace(old_guard, new_guard, 1)
          old_contributing = "    '''```bash\npython -m unittest discover -s tests -v\n```\n''',\n"
          new_contributing = "    '''```bash\npython3 -m venv .venv\n.venv/bin/python -m pip install -r requirements.txt\n.venv/bin/python -m unittest discover -s tests -v\n```\n''',\n"
          if part3.count(old_contributing) != 1:
              raise RuntimeError("part3 contributing source drifted")
          part3_path.write_text(part3.replace(old_contributing, new_contributing, 1), encoding="utf-8")
          PY
      - name: Apply focused patches
        run: |
          python tools/apply_v350_part1.py
          python tools/apply_v350_part2.py
          python tools/apply_v350_part3.py
      - name: Install package
        run: python -m pip install .
      - name: Validate source and browser syntax
        run: |
          python -m pip check
          python -m compileall -q .
          node --check web/app.js
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified implementation
        run: |
          rm -rf build
          grep -qxF 'build/' .gitignore || printf '\nbuild/\n' >> .gitignore
          git restore .github/workflows/tests.yml .github/workflows/branch-autofix.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Lab transport and expose anonymous master maps"
          git push origin HEAD:improve/lab-hardening-3.5
