name: Apply designspace proof grid

on:
  push:
    branches: [improve/lab-hardening-3.5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: improve/lab-hardening-3.5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply proof-grid integration
        if: ${{ hashFiles('tools/apply_proof_grid.py') != '' }}
        run: python tools/apply_proof_grid.py
      - name: Install package
        if: ${{ hashFiles('tools/apply_proof_grid.py') != '' }}
        run: python -m pip install .
      - name: Run browser and Python gauntlets
        if: ${{ hashFiles('tools/apply_proof_grid.py') != '' }}
        run: |
          python -m pip check
          python -m compileall -q .
          node --check web/app.js
          node --check web/lab-proof.js
          node --test tests/lab-proof.test.cjs
          python -m unittest discover -s tests -v
      - name: Build and inspect native macOS package
        if: ${{ hashFiles('tools/apply_proof_grid.py') != '' }}
        run: |
          ./build-fontblind-app.command --no-install
          test -s output/macos/FontBlind.zip
          test -s output/macos/FontBlind.zip.sha256
          unzip -tq output/macos/FontBlind.zip
          unzip -l output/macos/FontBlind.zip | grep -q 'web/lab-proof.js'
      - name: Commit verified integration
        if: ${{ hashFiles('tools/apply_proof_grid.py') != '' }}
        run: |
          rm -rf build
          rm tools/apply_proof_grid.py
          git restore .github/workflows/proof-grid-autofix.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add deterministic designspace proof grids"
          git push origin HEAD:improve/lab-hardening-3.5
