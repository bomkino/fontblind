name: Refine Linux package

on:
  push:
    branches:
      - codex/linux-browser-app-foundation

permissions:
  contents: write

concurrency:
  group: refine-linux-package
  cancel-in-progress: false

jobs:
  refine:
    if: github.event.head_commit.message == 'Refine Linux package'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/linux-browser-app-foundation
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply provenance refinements
        run: python tools/refine_linux_package.py
      - name: Validate focused package boundary
        run: |
          sh -n linux/fontblind-launcher.sh
          bash -n build-fontblind-linux.sh
          python -m py_compile tests/test_linux_packaging.py
          python -m unittest tests.test_linux_packaging -v
          test ! -e .github/workflows/refine-linux-package.yml
          test ! -e tools/refine_linux_package.py
      - name: Commit refinements
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Harden Linux package provenance and desktop layout"
          git push origin "HEAD:${GITHUB_REF_NAME}"
