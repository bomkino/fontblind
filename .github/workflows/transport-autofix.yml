name: Apply bounded transport finish

on:
  push:
    branches: [improve/lab-hardening-3.5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: improve/lab-hardening-3.5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply transport hardening
        if: ${{ hashFiles('tools/apply_transport_finish.py') != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          patch = Path("tools/apply_transport_finish.py")
          text = patch.read_text(encoding="utf-8")
          old = '"Content-Length": "9" * 100_000,'
          if text.count(old) != 1:
              raise RuntimeError("HTTP pathological-length test drifted")
          patch.write_text(text.replace(old, '"Content-Length": "9" * 100,', 1), encoding="utf-8")
          PY
          python tools/apply_transport_finish.py
          python - <<'PY'
          from pathlib import Path
          path = Path("fontblind_protocol.py")
          text = path.read_text(encoding="utf-8")
          old = '''    while remaining:
              block = stream.read(remaining)
              if not block:
                  raise FontSetError("The local Lab upload was interrupted.")
          '''
          new = '''    while remaining:
              try:
                  block = stream.read(remaining)
              except OSError as exc:
                  raise FontSetError("The local Lab upload was interrupted.") from exc
              if not block:
                  raise FontSetError("The local Lab upload was interrupted.")
          '''
          if text.count(old) != 1:
              raise RuntimeError("protocol read boundary drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install package
        if: ${{ hashFiles('tools/apply_transport_finish.py') != '' }}
        run: python -m pip install .
      - name: Run transport, browser, and Python gauntlets
        if: ${{ hashFiles('tools/apply_transport_finish.py') != '' }}
        run: |
          python -m pip check
          python -m compileall -q .
          node --check web/app.js
          node --check web/lab-proof.js
          node --test tests/lab-proof.test.cjs
          if grep -Fq 'target.read_bytes()' fontblind_app.py; then
            echo 'Whole-output download buffering returned.' >&2
            exit 1
          fi
          python -m unittest discover -s tests -v
      - name: Build and smoke-test native macOS package
        if: ${{ hashFiles('tools/apply_transport_finish.py') != '' }}
        run: |
          ./build-fontblind-app.command --no-install
          test -s output/macos/FontBlind.zip
          test -s output/macos/FontBlind.zip.sha256
          unzip -tq output/macos/FontBlind.zip
          BUNDLE_ROOT="$(mktemp -d)"
          ditto -x -k output/macos/FontBlind.zip "$BUNDLE_ROOT"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_ROOT/FontBlind.app"
          SERVER="$BUNDLE_ROOT/FontBlind.app/Contents/Resources/server/FontBlindServer"
          SERVER_LOG="$BUNDLE_ROOT/server.log"
          "$SERVER" >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          cleanup_server() {
            kill -TERM "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          for _ in {1..100}; do
            grep -Eq '^FONTBLIND_READY 127\.0\.0\.1 [0-9]+$' "$SERVER_LOG" && break
            kill -0 "$SERVER_PID" 2>/dev/null || { cat "$SERVER_LOG" >&2; exit 1; }
            sleep 0.1
          done
          grep -Eq '^FONTBLIND_READY 127\.0\.0\.1 [0-9]+$' "$SERVER_LOG"
          cleanup_server
          trap - EXIT
      - name: Commit verified transport finish
        if: ${{ hashFiles('tools/apply_transport_finish.py') != '' }}
        run: |
          rm -rf build
          rm tools/apply_transport_finish.py
          git restore .github/workflows/transport-autofix.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish bounded local transport in both directions"
          git push origin HEAD:improve/lab-hardening-3.5
