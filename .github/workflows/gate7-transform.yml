name: Gate 7 transform artifact

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: read

jobs:
  transform:
    if: github.event.head_commit.message == 'Upload Gate 7 transform artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Transform reviewed source files
        run: python tools/prepare_gate7_artifact.py
      - name: Validate transformed files
        run: |
          python -m py_compile gate7-output/release_gauntlet.py gate7-output/tests/test_pipeline.py
          ! grep -q "<<'PY'" gate7-output/build-fontblind-app.command
          grep -q 'release_gauntlet.py" "$SERVER_URL" "$SMOKE_ROOT' gate7-output/build-fontblind-app.command
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate7-transformed-files
          path: gate7-output
          if-no-files-found: error
          retention-days: 1
