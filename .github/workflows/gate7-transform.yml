name: Gate 7 transform preview

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: read

jobs:
  transform:
    if: github.event.head_commit.message == 'Run Gate 7 transform preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Transform reviewed source files
        run: python tools/prepare_gate7_artifact.py
      - name: Validate transformed files
        run: |
          python -m py_compile gate7-output/release_gauntlet.py gate7-output/tests/test_pipeline.py
          ! grep -q "<<'PY'" gate7-output/build-fontblind-app.command
          grep -q 'release_gauntlet.py" "$SERVER_URL" "$SMOKE_ROOT' gate7-output/build-fontblind-app.command
      - name: Emit transformed files
        run: |
          for file in gate7-output/build-fontblind-app.command gate7-output/release_gauntlet.py gate7-output/tests/test_pipeline.py; do
            echo "FONTBLIND_FILE_BEGIN ${file}"
            gzip -c "$file" | base64 -w0
            echo
            echo "FONTBLIND_FILE_END ${file}"
          done
