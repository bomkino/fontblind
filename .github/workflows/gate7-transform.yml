name: Gate 7 transform artifact

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: read

tasks: {}

jobs:
  transform:
    if: github.event.head_commit.message == 'Prepare Gate 7 transform artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Transform reviewed source files
        run: |
          python - <<'PY'
          from __future__ import annotations

          import shutil
          from pathlib import Path
          from textwrap import indent

          pipeline_path = Path("tests/test_pipeline.py")
          pipeline = pipeline_path.read_text(encoding="utf-8")
          if "import os\n" not in pipeline:
              pipeline = pipeline.replace("import tempfile\n", "import os\nimport tempfile\n", 1)
          old_samples = '''FONT_ROOTS = (Path("/System/Library/Fonts"), Path("/Library/Fonts"))


def find_sample(required_table: str) -> Path | None:
    for root in FONT_ROOTS:
        if not root.is_dir():
            continue
        for path in sorted((*root.rglob("*.ttf"), *root.rglob("*.otf"))):
            try:
                font = TTFont(str(path), lazy=True)
                has_table = required_table in font
                font.close()
                if has_table:
                    inspect_strict_source(path)
                    return path
            except Exception:
                continue
    return None


TTF_SAMPLE = find_sample("glyf")
CFF_SAMPLE = find_sample("CFF ")
VARIABLE_SAMPLE = find_sample("fvar")
'''
          new_samples = '''FONT_ROOTS = (Path("/System/Library/Fonts"), Path("/Library/Fonts"))
CORPUS_ROOT = Path(
    os.environ.get(
        "FONTBLIND_CORPUS_DIR",
        Path(__file__).resolve().parent / "corpus" / "cache",
    )
)


def corpus_sample(filename: str, required_table: str) -> Path | None:
    path = CORPUS_ROOT / filename
    if not path.is_file():
        return None
    try:
        font = TTFont(str(path), lazy=True)
        has_table = required_table in font
        font.close()
        if has_table:
            inspect_strict_source(path)
            return path
    except Exception:
        return None
    return None


def find_sample(required_table: str) -> Path | None:
    for root in FONT_ROOTS:
        if not root.is_dir():
            continue
        for path in sorted((*root.rglob("*.ttf"), *root.rglob("*.otf"))):
            try:
                font = TTFont(str(path), lazy=True)
                has_table = required_table in font
                font.close()
                if has_table:
                    inspect_strict_source(path)
                    return path
            except Exception:
                continue
    return None


TTF_SAMPLE = corpus_sample("latin-static.ttf", "glyf") or find_sample("glyf")
CFF_SAMPLE = corpus_sample("cff-static.otf", "CFF ") or find_sample("CFF ")
VARIABLE_SAMPLE = corpus_sample("arabic-variable.ttf", "fvar") or find_sample("fvar")
'''
          if old_samples not in pipeline:
              raise SystemExit("test_pipeline sample-discovery anchor drifted")
          pipeline_path.write_text(pipeline.replace(old_samples, new_samples, 1), encoding="utf-8")

          build_path = Path("build-fontblind-app.command")
          build = build_path.read_text(encoding="utf-8")
          start_marker = '"$PYTHON" - "$SERVER_URL" "$SMOKE_ROOT" <<\'PY\'\n'
          end_marker = '\nPY\n\nkill "$SERVER_PID"'
          start = build.find(start_marker)
          end = build.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("native smoke here-document anchor drifted")
          body = build[start + len(start_marker):end]
          body_lines = body.splitlines()
          if body_lines and body_lines[0].strip() == "from __future__ import annotations":
              body_lines = body_lines[1:]
          body = "\n".join(body_lines).lstrip("\n")
          body = body.replace("sys.argv[1]", "arguments[1]").replace("sys.argv[2]", "arguments[2]")
          release = '''#!/usr/bin/env python3
"""Reusable exact-runtime product gauntlet for source and frozen servers."""
from __future__ import annotations

import sys


def main(argv: list[str] | None = None) -> int:
    arguments = list(sys.argv if argv is None else argv)
    if len(arguments) != 3:
        return 64
'''
          release += indent(body, "    ") + "\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
          Path("release_gauntlet.py").write_text(release, encoding="utf-8")

          invocation = '"$PYTHON" "$APP_DIR/release_gauntlet.py" "$SERVER_URL" "$SMOKE_ROOT"'
          build = build[:start] + invocation + build[end + len("\nPY"):]
          slash = chr(92)
          hidden_anchor = "  --hidden-import=fontblind_instance " + slash + "\n"
          hidden_insert = (
              hidden_anchor
              + "  --hidden-import=fontblind_instance_proof " + slash + "\n"
              + "  --hidden-import=fontblind_instance_verified " + slash + "\n"
          )
          if hidden_anchor not in build:
              raise SystemExit("PyInstaller hidden-import anchor drifted")
          build_path.write_text(build.replace(hidden_anchor, hidden_insert, 1), encoding="utf-8")

          output = Path("gate7-output")
          (output / "tests").mkdir(parents=True)
          shutil.copy2(build_path, output / build_path.name)
          shutil.copy2("release_gauntlet.py", output / "release_gauntlet.py")
          shutil.copy2(pipeline_path, output / "tests" / "test_pipeline.py")
          PY
      - name: Validate transformed files
        run: |
          python -m py_compile gate7-output/release_gauntlet.py gate7-output/tests/test_pipeline.py
          ! grep -q "<<'PY'" gate7-output/build-fontblind-app.command
          grep -q 'release_gauntlet.py" "$SERVER_URL" "$SMOKE_ROOT' gate7-output/build-fontblind-app.command
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate7-transformed-files
          path: gate7-output
          if-no-files-found: error
          retention-days: 1
