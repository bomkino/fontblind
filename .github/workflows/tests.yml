name: Tests

on:
  push:
    branches: [main, ci/gate2-runtime-validation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check browser JavaScript syntax
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
      - name: Run browser contract tests
        run: node --test tests/*.test.cjs
      - name: Smoke-test hardened runtime imports
        run: python -c "from fontblind_runtime import ContractFontBlindServer; from fontblind_instance import build_static_instance_outputs"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  package:
    name: Native macOS package
    runs-on: macos-latest
    timeout-minutes: 40
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build ad-hoc signed app
        run: ./build-fontblind-app.command --no-install
      - name: Verify package artifacts
        run: |
          test -s output/macos/FontBlind.zip
          test -s output/macos/FontBlind.zip.sha256
          unzip -tq output/macos/FontBlind.zip
