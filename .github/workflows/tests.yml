name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Fetch pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
      - name: Verify pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR" --verify-only
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check browser JavaScript syntax
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
      - name: Run browser contract tests
        run: node --test tests/*.test.cjs
      - name: Smoke-test hardened runtime imports
        run: |
          python - <<'PY'
          from fontblind_runtime import ContractFontBlindServer
          from fontblind_instance_verified import build_static_instance_outputs, verify_static_instance_outputs
          from release_gauntlet import main as release_main

          assert release_main(["release_gauntlet.py"]) == 64
          PY
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Assert tracked source stayed clean
        run: test -z "$(git status --short --untracked-files=no)"

  corpus:
    name: Representative corpus · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
      FONTBLIND_RUN_FULL_CORPUS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Fetch pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
      - name: Verify pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR" --verify-only
      - name: Run representative corpus gauntlet
        run: python -m unittest tests.test_corpus -v
      - name: Assert tracked source stayed clean
        run: test -z "$(git status --short --untracked-files=no)"

  package:
    name: Native macOS package
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [test, corpus]
    env:
      FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
      - name: Verify pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR" --verify-only
      - name: Build ad-hoc signed app
        run: ./build-fontblind-app.command --no-install
      - name: Verify package artifacts
        run: |
          test -s output/macos/FontBlind.zip
          test -s output/macos/FontBlind.zip.sha256
          shasum -a 256 -c output/macos/FontBlind.zip.sha256
          unzip -tq output/macos/FontBlind.zip
          printf '%s\n' "$VERIFIED_SHA" > output/macos/SOURCE_SHA
      - name: Upload verified macOS package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fontblind-macos-${{ env.VERIFIED_SHA }}
          path: |
            output/macos/FontBlind.zip
            output/macos/FontBlind.zip.sha256
            output/macos/SOURCE_SHA
          if-no-files-found: error
          retention-days: 30

  garuda-package:
    name: Garuda KDE package · x86_64
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 90
    needs: [test, corpus]
    env:
      FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
    steps:
      - name: Install Git for exact checkout
        shell: bash
        run: pacman -Syu --noconfirm --needed git
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(cat .git/HEAD)" = "$VERIFIED_SHA"
      - name: Install current Arch build and desktop tools
        shell: bash
        run: |
          pacman -S --noconfirm --needed \
            python python-pip curl file binutils libarchive zstd \
            xdg-utils kde-cli-tools hicolor-icon-theme desktop-file-utils nodejs shadow
          useradd --create-home --uid 1001 builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          bash -n build-fontblind-linux.sh
          bash -n linux/verify-installed-package.sh
          bash -n linux/dell-g7-preflight.sh
          sh -n linux/fontblind
      - name: Build reproducible Garuda package
        shell: bash
        run: |
          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            FONTBLIND_CORPUS_DIR="$FONTBLIND_CORPUS_DIR" \
            bash -lc '
              set -euo pipefail
              cd "$GITHUB_WORKSPACE"
              python3 tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
              python3 tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR" --verify-only
              ./build-fontblind-linux.sh
              python3 -m venv /home/builder/fontblind-test-venv
              /home/builder/fontblind-test-venv/bin/python -m pip install --disable-pip-version-check --quiet .
            '
      - name: Install and inspect package
        shell: bash
        run: |
          PACKAGE="$(find output/linux -maxdepth 1 -type f -name 'fontblind-bin-3.7.0-1-x86_64.pkg.tar.zst' -print -quit)"
          test -n "$PACKAGE"
          (
            cd "$(dirname "$PACKAGE")"
            sha256sum -c "$(basename "$PACKAGE").sha256"
          )
          pacman -Qp "$PACKAGE" | grep -qx 'fontblind-bin 3.7.0-1'
          pacman -U --noconfirm "$PACKAGE"
          pacman -Qk fontblind-bin
          pacman -Qo /usr/bin/fontblind /opt/fontblind/FontBlindServer/FontBlindServer
          pacman -T glibc hicolor-icon-theme xdg-utils kde-cli-tools
          desktop-file-validate /usr/share/applications/fontblind.desktop

          set +e
          /usr/bin/fontblind unexpected >/tmp/fontblind-arguments.log 2>&1
          ARGUMENT_STATUS=$?
          /usr/bin/fontblind >/tmp/fontblind-root-launcher.log 2>&1
          ROOT_LAUNCHER_STATUS=$?
          /opt/fontblind/FontBlindServer/FontBlindServer \
            --fontblind-browser-app --no-open >/tmp/fontblind-root-entry.log 2>&1
          ROOT_ENTRY_STATUS=$?
          set -e
          test "$ARGUMENT_STATUS" -eq 64
          test "$ROOT_LAUNCHER_STATUS" -eq 77
          test "$ROOT_ENTRY_STATUS" -eq 77
      - name: Exercise installed KDE Wayland lifecycle and full gauntlet
        shell: bash
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE/tests/corpus/cache"
          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            FONTBLIND_CORPUS_DIR="$FONTBLIND_CORPUS_DIR" \
            FONTBLIND_TEST_PYTHON=/home/builder/fontblind-test-venv/bin/python \
            bash -lc '
              set -euo pipefail
              cd "$GITHUB_WORKSPACE"
              ./linux/verify-installed-package.sh "$GITHUB_WORKSPACE" "$FONTBLIND_CORPUS_DIR"
            '
      - name: Uninstall without residue
        shell: bash
        run: |
          pacman -Rns --noconfirm fontblind-bin
          test ! -e /usr/bin/fontblind
          test ! -e /opt/fontblind
          test ! -e /usr/share/applications/fontblind.desktop
          test ! -e /usr/share/icons/hicolor/scalable/apps/fontblind.svg
          printf '%s\n' "$VERIFIED_SHA" > output/linux/SOURCE_SHA
      - name: Upload verified Garuda package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fontblind-garuda-kde-x86_64-${{ env.VERIFIED_SHA }}
          path: |
            output/linux/fontblind-bin-3.7.0-1-x86_64.pkg.tar.zst
            output/linux/fontblind-bin-3.7.0-1-x86_64.pkg.tar.zst.sha256
            output/linux/SOURCE_SHA
            linux/dell-g7-preflight.sh
            docs/LINUX_ACCEPTANCE.md
            linux/README.txt
          if-no-files-found: error
          retention-days: 30
