name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Native macOS package
    runs-on: macos-latest
    timeout-minutes: 35
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build ad-hoc signed app
        run: ./build-fontblind-app.command --no-install
      - name: Verify package artifacts
        run: |
          test -s output/macos/FontBlind.zip
          test -s output/macos/FontBlind.zip.sha256
          unzip -tq output/macos/FontBlind.zip
