name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Fetch pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
      - name: Verify pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR" --verify-only
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check browser JavaScript syntax
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
      - name: Run browser contract tests
        run: node --test tests/*.test.cjs
      - name: Smoke-test hardened runtime imports
        run: |
          python - <<'PY'
          from fontblind_runtime import ContractFontBlindServer
          from fontblind_instance_verified import build_static_instance_outputs, verify_static_instance_outputs
          from release_gauntlet import main as release_main

          assert release_main(["release_gauntlet.py"]) == 64
          PY
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  corpus:
    name: Representative corpus · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
      FONTBLIND_RUN_FULL_CORPUS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Fetch pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
      - name: Verify pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR" --verify-only
      - name: Run representative corpus gauntlet
        run: python -m unittest tests.test_corpus -v

  package:
    name: Native macOS package
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [test, corpus]
    env:
      FONTBLIND_CORPUS_DIR: ${{ github.workspace }}/tests/corpus/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR"
      - name: Verify pinned release corpus
        run: python tools/fetch_corpus.py --output "$FONTBLIND_CORPUS_DIR" --verify-only
      - name: Build ad-hoc signed app
        run: ./build-fontblind-app.command --no-install
      - name: Verify package artifacts
        run: |
          test -s output/macos/FontBlind.zip
          test -s output/macos/FontBlind.zip.sha256
          shasum -a 256 -c output/macos/FontBlind.zip.sha256
          unzip -tq output/macos/FontBlind.zip
