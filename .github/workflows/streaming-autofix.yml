name: Apply bounded upload streaming

on:
  push:
    branches: [improve/lab-hardening-3.5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: improve/lab-hardening-3.5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply streaming integration
        if: ${{ hashFiles('tools/apply_streaming_uploads.py') != '' }}
        run: python tools/apply_streaming_uploads.py
      - name: Install package
        if: ${{ hashFiles('tools/apply_streaming_uploads.py') != '' }}
        run: python -m pip install .
      - name: Run streaming, browser, and Python gauntlets
        if: ${{ hashFiles('tools/apply_streaming_uploads.py') != '' }}
        run: |
          python -m pip check
          python -m compileall -q .
          node --check web/app.js
          node --check web/lab-proof.js
          node --test tests/lab-proof.test.cjs
          if grep -Fq 'file.arrayBuffer()' web/app.js; then
            echo 'Whole-file browser buffering returned.' >&2
            exit 1
          fi
          python -m unittest discover -s tests -v
      - name: Build and inspect native macOS package
        if: ${{ hashFiles('tools/apply_streaming_uploads.py') != '' }}
        run: |
          ./build-fontblind-app.command --no-install
          test -s output/macos/FontBlind.zip
          test -s output/macos/FontBlind.zip.sha256
          unzip -tq output/macos/FontBlind.zip
          unzip -l output/macos/FontBlind.zip | grep -q 'fontblind_stream'
      - name: Commit verified streaming path
        if: ${{ hashFiles('tools/apply_streaming_uploads.py') != '' }}
        run: |
          rm -rf build
          rm tools/apply_streaming_uploads.py
          git restore .github/workflows/streaming-autofix.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stream uploads into bounded anonymous descriptors"
          git push origin HEAD:improve/lab-hardening-3.5
