name: Gate 7 corpus probe

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Probe pinned Gate 7 corpus candidates'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FontBlind
        run: python -m pip install .
      - name: Download pinned upstream candidates
        run: |
          set -euo pipefail
          mkdir -p /tmp/fontblind-corpus-probe
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/6a003b5eb672dc8bf5bff5937cf5863f8b175445/ofl/abeezee/ABeeZee-Regular.ttf' \
            -o /tmp/fontblind-corpus-probe/latin-static.ttf
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/6a003b5eb672dc8bf5bff5937cf5863f8b175445/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf' \
            -o /tmp/fontblind-corpus-probe/arabic-variable.ttf
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/6a003b5eb672dc8bf5bff5937cf5863f8b175445/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf' \
            -o /tmp/fontblind-corpus-probe/devanagari-variable.ttf
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/6a003b5eb672dc8bf5bff5937cf5863f8b175445/ofl/notosanshebrew/NotoSansHebrew%5Bwdth%2Cwght%5D.ttf' \
            -o /tmp/fontblind-corpus-probe/hebrew-variable.ttf
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/6a003b5eb672dc8bf5bff5937cf5863f8b175445/ofl/notosansthai/NotoSansThai%5Bwdth%2Cwght%5D.ttf' \
            -o /tmp/fontblind-corpus-probe/thai-variable.ttf
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/adobe-fonts/source-code-pro/803b7e23ec97ae58b6232ea76519a76d428ba268/OTF/SourceCodePro-Regular.otf' \
            -o /tmp/fontblind-corpus-probe/cff-static.otf
          sha256sum /tmp/fontblind-corpus-probe/*
      - name: Probe strict policy and full browser pipeline
        run: |
          python - <<'PY'
          from __future__ import annotations

          import tempfile
          from pathlib import Path

          from fontTools.ttLib import TTFont

          from fontblind_pipeline import build_browser_outputs
          from fontblind_policy import inspect_strict_source

          root = Path('/tmp/fontblind-corpus-probe')
          failed = False
          for source in sorted(root.iterdir()):
              print(f'\n=== {source.name} ===')
              font = TTFont(str(source), lazy=True)
              try:
                  tags = sorted(font.reader.keys())
                  print('tables:', ','.join(tags))
                  print('flavor:', 'variable' if 'fvar' in font else 'static', 'CFF' if 'CFF ' in font else 'CFF2' if 'CFF2' in font else 'glyf')
              finally:
                  font.close()
              try:
                  contract = inspect_strict_source(source)
                  print('strict:', contract)
                  with tempfile.TemporaryDirectory(prefix='fontblind-corpus-probe-') as temporary:
                      result = build_browser_outputs(source, Path(temporary), verify_rounds=1)
                      result.require_verified()
                      print('pipeline: PASS', result.flavor, 'variable=' + str(result.variable))
              except Exception as exc:
                  failed = True
                  print('pipeline: FAIL', type(exc).__name__, str(exc))
          if failed:
              raise SystemExit('one or more corpus candidates failed')
          PY
