name: Materialize Linux desktop foundation

on:
  push:
    branches:
      - codex/linux-browser-app-foundation

permissions:
  contents: write

concurrency:
  group: linux-materialize
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Linux desktop foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/linux-browser-app-foundation
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Materialize reviewed source changes
        run: |
          test "$(cat .linux-materialize/part-* | sha256sum | awk '{print $1}')" = "b71a6875ceedea1983e36cde7b161e41b76c53843f9c95eb03340929eb45179f"
          cat .linux-materialize/part-* | base64 --decode | tar -xzf -
          rm -rf .linux-materialize
          chmod 0755 build-fontblind-linux.sh
      - name: Validate the materialized tree
        run: |
          python -m pip install .
          python -m pip check
          python -m compileall -q .
          bash -n build-fontblind-linux.sh
          for file in web/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit the Linux foundation without workflow writes
        run: |
          git checkout HEAD -- .github/workflows/tests.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Add the Garuda-first Linux desktop edition"
          git push origin "HEAD:${GITHUB_REF_NAME}"
