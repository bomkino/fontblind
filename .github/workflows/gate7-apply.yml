name: Gate 7 apply sample discovery

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Gate 7 sample discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - name: Materialize pinned corpus sample discovery
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          helper_path = Path('tools/prepare_gate7_artifact.py')
          spec = importlib.util.spec_from_file_location('gate7_helper', helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit('could not load Gate 7 helper')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path('tests/test_pipeline.py').write_text(module._pipeline(), encoding='utf-8')
          PY
          rm -f tools/prepare_gate7_artifact.py
          rm -f .github/workflows/gate7-transform.yml
          rm -f .github/workflows/gate7-apply.yml
      - name: Validate
        run: |
          python -m py_compile release_gauntlet.py tests/test_pipeline.py
          ! grep -q "<<'PY'" build-fontblind-app.command
          grep -q 'release_gauntlet.py" "$SERVER_URL" "$SMOKE_ROOT' build-fontblind-app.command
          grep -q 'CORPUS_ROOT' tests/test_pipeline.py
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Wire pinned corpus into legacy pipeline coverage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
