name: Gate 7 apply transformed files

on:
  push:
    branches:
      - improve/inspect-instance-proof-3.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Gate 7 transformed files'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/inspect-instance-proof-3.6
          fetch-depth: 1
      - name: Materialize reviewed files
        run: |
          python tools/prepare_gate7_artifact.py
          cp gate7-output/build-fontblind-app.command build-fontblind-app.command
          cp gate7-output/release_gauntlet.py release_gauntlet.py
          cp gate7-output/tests/test_pipeline.py tests/test_pipeline.py
          rm -rf gate7-output
          rm -f tools/prepare_gate7_artifact.py
          rm -f .github/workflows/gate7-transform.yml
          rm -f .github/workflows/gate7-apply.yml
      - name: Validate
        run: |
          python -m py_compile release_gauntlet.py tests/test_pipeline.py
          ! grep -q "<<'PY'" build-fontblind-app.command
          grep -q 'release_gauntlet.py" "$SERVER_URL" "$SMOKE_ROOT' build-fontblind-app.command
      - name: Commit
        run: |
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "Apply the reusable Gate 7 release gauntlet"
          git push origin "HEAD:${GITHUB_REF_NAME}"
